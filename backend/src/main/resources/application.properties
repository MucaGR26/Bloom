spring.application.name=bloom-api
server.port=${PORT:3000}

# Em produção, defina JWT_SECRET com uma chave longa e aleatória (mínimo de 32 caracteres).
bloom.jwt.secret=${JWT_SECRET:bloom-local-development-secret-change-me}
bloom.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# Recuperação de senha: sem SPRING_MAIL_HOST, o código aparece no console do Spring.
bloom.mail-from=${MAIL_FROM:nao-responda@bloom.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Conexão com o MySQL. As tabelas são criadas pelo schema.sql (mesmas do "Script do banco").
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloom?createDatabaseIfNotExist=true&connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
